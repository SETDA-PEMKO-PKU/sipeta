version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sipeta_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - sipeta_network
    depends_on:
      - db

  nginx:
    image: nginx:1.25-alpine
    container_name: sipeta_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - sipeta_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sipeta_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sipeta}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-sipeta}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - sipeta_db_data:/var/lib/mysql
    networks:
      - sipeta_network

networks:
  sipeta_network:
    driver: bridge

volumes:
  sipeta_db_data:
    driver: local
